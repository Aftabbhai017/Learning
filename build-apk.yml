name: Build APK
on:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Unpack project
        run: |
          if [ ! -d android ]; then unzip -q LearningHubPlus_Project.zip; fi
          D=$(dirname "$(find . -name settings.gradle -not -path './.git/*' | head -1)")
          echo "PROJECT_DIR=$D" >> "$GITHUB_ENV"
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Build debug APK
        working-directory: ${{ env.PROJECT_DIR }}
        run: gradle assembleDebug --no-daemon --stacktrace
      - name: Verify APK exists
        run: |
          APK=$(find "$PROJECT_DIR" -name '*-debug.apk' | head -1)
          echo "Found: $APK"; ls -l "$APK"
          mkdir -p out && cp "$APK" out/LearningHubPlus.apk
      - uses: actions/upload-artifact@v4
        with:
          name: LearningHubPlus-apk
          path: out/LearningHubPlus.apk
